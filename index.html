<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Picker — demo</title>
<link rel="stylesheet" href="./color-picker.css">
<style>
  :root {
    --page-ink: #172033;
    --page-muted: #667085;
    --page-line: #e5e9f0;
    --page-accent: #2563eb;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--page-ink);
    background: radial-gradient(circle at 50% 0%, #eaf0ff 0, #f4f6fa 48%, #f7f8fb 100%);
    display: grid; place-items: center; padding: 28px;
  }
  .demo { width: min(100%, 980px); display: grid; gap: 18px; }
  .demo-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .demo-head h1 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
  .demo-head p { margin: 5px 0 0; color: var(--page-muted); font-size: 13px; }
  .open-btn {
    border: 0; border-radius: 11px; background: var(--page-accent); color: #fff;
    padding: 11px 17px; font: inherit; font-weight: 650; cursor: pointer;
    box-shadow: 0 4px 12px #2563eb25;
  }
  .preview { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .preview-card { border: 1px solid var(--page-line); background: #fff; border-radius: 14px; padding: 18px; }
  .preview-card small { color: var(--page-muted); display: block; margin-bottom: 10px; }
  .sample-chip { display: inline-flex; padding: 9px 13px; border-radius: 9px; font-weight: 650; }
  .sample-panel { min-height: 76px; border-radius: 10px; padding: 15px; display: flex; align-items: center; }
  .values { margin: 0; color: var(--page-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  @media (max-width: 680px) {
    body { padding: 12px; align-items: start; }
    .preview { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="demo">
  <div class="demo-head">
    <div>
      <h1>Color system preview</h1>
      <p>Explore foreground and background colors together.</p>
    </div>
    <button class="open-btn" id="openPicker">Choose colors</button>
  </div>

  <div class="preview">
    <div class="preview-card">
      <small>Text color · High contrast</small>
      <span class="sample-chip" id="sampleChip" style="color: #0F766E; background: #CCFBF1">Readable label</span>
    </div>
    <div class="preview-card">
      <small>Panel background · Low contrast</small>
      <div class="sample-panel" id="samplePanel" style="color: #0F766E; background: #CCFBF1">A subtle panel background</div>
    </div>
  </div>

  <p class="values" id="values">#0F766E · #CCFBF1</p>
</main>

<script type="module">
  import ColorPicker from './src/color-picker.js';

  const chip = document.getElementById('sampleChip');
  const panel = document.getElementById('samplePanel');
  const values = document.getElementById('values');

  const paint = (colors) => {
    chip.style.color = colors.highContrast;
    chip.style.background = colors.lowContrast;
    panel.style.color = colors.highContrast;
    panel.style.background = colors.lowContrast;
    values.textContent = `${colors.highContrast} · ${colors.lowContrast}`;
  };

  const picker = new ColorPicker({
    initialColors: { highContrast: '#0F766E', lowContrast: '#CCFBF1' },
    onChange: paint,
    onCancel: () => paint(picker.getColors()),
    onApply: (colors) => {
      paint(colors);
      document.getElementById('openPicker').focus();
    },
  });

  paint(picker.getColors());
  document.getElementById('openPicker').addEventListener('click', () => picker.open());
  window.demoPicker = picker;
</script>
</body>
</html>
