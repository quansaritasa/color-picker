<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>smoke</title>
<link rel="stylesheet" href="../color-picker.css">
</head>
<body>
<button id="host">host</button>
<pre id="results">running…</pre>
<script type="module">
  import ColorPicker from '../src/color-picker.js';

  const out = [];
  let failures = 0;
  const check = (name, ok, detail = '') => {
    if (!ok) failures += 1;
    out.push(`${ok ? 'PASS' : 'FAIL'} ${name}${detail ? ' :: ' + detail : ''}`);
  };
  const rootOf = (picker) => picker.root;
  const q = (picker, sel) => picker.root.querySelector(sel);

  /* Most checks need the pair; only the default-slot check takes the shipped
     single slot, so the helper declares the pair unless the caller overrides. */
  const PAIR = [
    { id: 'text', label: 'Text colour', symbol: 'Aa', presetSet: 'text' },
    { id: 'background', label: 'Panel background', symbol: '▰', presetSet: 'panel' },
  ];
  const mk = (options = {}) => new ColorPicker(Object.assign({ slots: PAIR }, options));

  const events = [];
  const picker = mk({
    initialColors: { text: '#0F766E', background: '#CCFBF1' },
    onChange: (c) => events.push(['change', c]),
    onApply: (c) => events.push(['apply', c]),
    onCancel: (c) => events.push(['cancel', c]),
    onOpen: (c) => events.push(['open', c]),
    onClose: (c) => events.push(['close', c]),
  });

  // 1. mount + closed
  check('mounts a hidden root', rootOf(picker).classList.contains('cp-root') && rootOf(picker).classList.contains('hidden'));
  // Pins the `.cp-root.hidden` rule itself: the class alone would still paint the overlay.
  check('closed root is display:none', getComputedStyle(rootOf(picker)).display === 'none', getComputedStyle(rootOf(picker)).display);
  check('initial colors normalized', JSON.stringify(picker.getColors()) === JSON.stringify({ text: '#0F766E', background: '#CCFBF1' }), JSON.stringify(picker.getColors()));
  check('two tabs rendered', picker.root.querySelectorAll('.tab').length === 2);

  // 2. open
  picker.open();
  check('open shows the modal', picker.isOpen && !rootOf(picker).classList.contains('hidden'));
  check('open root is displayed', getComputedStyle(rootOf(picker)).display !== 'none', getComputedStyle(rootOf(picker)).display);
  check('onOpen fired', events.some(([n]) => n === 'open'));
  check('active tab aria-selected', q(picker, '.tab.active').getAttribute('aria-selected') === 'true');

  // 3. HEX commit on the active tab
  const hex = q(picker, '.hex-input');
  hex.value = '#2563EB';
  hex.dispatchEvent(new Event('change', { bubbles: true }));
  check('hex change updates active tab', picker.getColors().text === '#2563EB', picker.getColors().text);
  check('onChange fired for hex', events.filter(([n]) => n === 'change').length >= 1);

  // 4. invalid hex is rejected without overwriting
  hex.value = '#zzz';
  hex.dispatchEvent(new Event('change', { bubbles: true }));
  check('invalid hex keeps the color', picker.getColors().text === '#2563EB');
  check('invalid hex shows a status message', q(picker, '.status').textContent.length > 0, q(picker, '.status').textContent);
  check('invalid hex reverts the field', hex.value === '#2563EB', hex.value);

  // 5. tab switching preserves per-tab colors
  picker.root.querySelectorAll('.tab')[1].click();
  check('tab switch sets activeSlot', picker.activeSlot === 'background');
  check('other tab keeps its color', picker.getColors().text === '#2563EB');
  check('editor shows the new tab color', hex.value === '#CCFBF1', hex.value);

  hex.value = '#DBEAFE80';
  hex.dispatchEvent(new Event('change', { bubbles: true }));
  check('alpha hex normalizes', picker.getColors().background === '#DBEAFE80', picker.getColors().background);

  // 6. getColors returns a copy
  const copy = picker.getColors();
  copy.text = '#000000';
  check('getColors returns a copy', picker.getColors().text === '#2563EB');

  // 7. setColors partial update
  const before = events.filter(([n]) => n === 'change').length;
  picker.setColors({ text: '#111827' });
  check('setColors applies a partial', picker.getColors().text === '#111827');
  check('setColors emits once', events.filter(([n]) => n === 'change').length === before + 1);
  picker.setColors({ text: '#111827' });
  check('setColors with no change does not emit', events.filter(([n]) => n === 'change').length === before + 1);

  // 8. SV drag updates the color
  const sv = q(picker, '.sv');
  const box = sv.getBoundingClientRect();
  const colorBeforeDrag = picker.getColors().background;
  const opts = { bubbles: true, pointerId: 1, clientX: box.left + box.width * 0.2, clientY: box.top + box.height * 0.8 };
  sv.dispatchEvent(new PointerEvent('pointerdown', opts));
  sv.dispatchEvent(new PointerEvent('pointermove', { ...opts, clientX: box.left + box.width * 0.9, clientY: box.top + box.height * 0.1, pointerId: 1 }));
  sv.dispatchEvent(new PointerEvent('pointerup', { ...opts, pointerId: 1 }));
  check('sv drag changes the color', picker.getColors().background !== colorBeforeDrag, `${colorBeforeDrag} -> ${picker.getColors().background}`);

  // 9. hue slider
  const hue = q(picker, '.hue-range input');
  const beforeHue = picker.getColors().background;
  hue.value = '30';
  hue.dispatchEvent(new Event('input', { bubbles: true }));
  check('hue slider changes the color', picker.getColors().background !== beforeHue);

  // 10. alpha slider
  const alpha = q(picker, '.alpha-range input');
  alpha.value = '50';
  alpha.dispatchEvent(new Event('input', { bubbles: true }));
  check('alpha slider produces an alpha hex', /^#[0-9A-F]{8}$/.test(picker.getColors().background), picker.getColors().background);

  // 11. reset keeps the modal open and restores initial colors
  picker.root.querySelector('.reset-btn').click();
  check('reset restores initial colors', picker.getColors().text === '#0F766E' && picker.getColors().background === '#CCFBF1', JSON.stringify(picker.getColors()));
  check('reset keeps the modal open', picker.isOpen);

  // 12. apply commits and closes
  picker.root.querySelector('.primary-btn').click();
  check('apply closes', !picker.isOpen);
  check('onApply fired', events.some(([n]) => n === 'apply'));

  // 13. cancel restores the open snapshot
  picker.open();
  picker.setActiveSlot('text');
  hex.value = '#FF0000';
  hex.dispatchEvent(new Event('change', { bubbles: true }));
  check('edit before cancel', picker.getColors().text === '#FF0000');
  picker.root.querySelector('.secondary-btn').click();
  check('cancel restores the snapshot', picker.getColors().text === '#0F766E', picker.getColors().text);
  check('cancel closes', !picker.isOpen);
  check('onCancel fired', events.some(([n]) => n === 'cancel'));

  // 14. escape cancels
  picker.open();
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  check('escape closes', !picker.isOpen);

  // 15. preset panel renders both palette groups, always
  picker.open();
  const highSection = q(picker, '.preset-section[data-group="text"]');
  const lowSection = q(picker, '.preset-section[data-group="panel"]');
  check('both palette groups are rendered',
    q(picker, '.presets').children.length === 2 && !!highSection && !!lowSection);
  check('group pills match their palettes',
    highSection.querySelectorAll('.cp-category').length === Object.keys(picker.palettes.text).length &&
    lowSection.querySelectorAll('.cp-category').length === Object.keys(picker.palettes.panel).length);
  check('group swatches match the first category',
    highSection.querySelectorAll('.cp-swatch').length === picker.palettes.text.Cool.length &&
    lowSection.querySelectorAll('.cp-swatch').length === picker.palettes.panel.Cool.length,
    `${highSection.querySelectorAll('.cp-swatch').length}/${lowSection.querySelectorAll('.cp-swatch').length}`);
  check('first pill is active in both groups',
    highSection.querySelector('.cp-category').classList.contains('is-active') &&
    lowSection.querySelector('.cp-category').classList.contains('is-active'));
  check("the active slot's group is emphasised",
    highSection.classList.contains('is-emphasis') && !lowSection.classList.contains('is-emphasis'));

  // 16. selection state marks the active colour wherever it appears
  check('the active colour is marked in its own group',
    highSection.querySelectorAll('.cp-swatch.is-selected').length === 1,
    String(highSection.querySelectorAll('.cp-swatch.is-selected').length));
  check('the other group marks only swatches of that same colour',
    lowSection.querySelectorAll('.cp-swatch.is-selected').length ===
      [...lowSection.querySelectorAll('.cp-swatch')].filter((n) => n.dataset.hex === '#0F766E').length);
  const marked = highSection.querySelector('.cp-swatch.is-selected');
  check('marked swatch carries the hex', marked && marked.dataset.hex === '#0F766E', marked && marked.dataset.hex);
  check('selected swatch has an aria-pressed state', marked && marked.getAttribute('aria-pressed') === 'true');
  check('check color adapts to luminance',
    marked.style.getPropertyValue('--cp-check-color').trim().length > 0,
    marked.style.getPropertyValue('--cp-check-color'));

  // 17. swatch click drives colors, editor and preview
  const changeBefore = events.filter(([n]) => n === 'change').length;
  const coolSwatch = [...highSection.querySelectorAll('.cp-swatch')].find((n) => n.dataset.hex === '#111827');
  coolSwatch.click();
  check('swatch click updates the color', picker.getColors().text === '#111827', picker.getColors().text);
  check('swatch click updates the hex field', q(picker, '.hex-input').value === '#111827', q(picker, '.hex-input').value);
  check('swatch click emits onChange', events.filter(([n]) => n === 'change').length === changeBefore + 1);
  check('swatch click moves the checkmark', coolSwatch.classList.contains('is-selected') && !marked.classList.contains('is-selected'));

  // 18. category pills swap the grid
  let pills = highSection.querySelectorAll('.cp-category');
  pills[1].click();
  pills = highSection.querySelectorAll('.cp-category');
  check('pill click activates the category', pills[1].classList.contains('is-active') && !pills[0].classList.contains('is-active'));
  check('pill click swaps the swatch set',
    highSection.querySelectorAll('.cp-swatch').length === picker.palettes.text[pills[1].textContent].length);
  check('color survives a category change', picker.getColors().text === '#111827');
  check('a color outside the category marks no swatch',
    highSection.querySelectorAll('.cp-swatch.is-selected').length === 0);
  pills[0].click();

  // 19. a palette is a suggestion: it writes the active slot, never its own
  const paleSwatch = [...lowSection.querySelectorAll('.cp-swatch')]
    .find((n) => n.dataset.hex !== picker.getColors().text);
  const tappedHex = paleSwatch.dataset.hex;
  paleSwatch.click();
  check('a panel swatch writes the active (text) slot', picker.getColors().text === tappedHex, picker.getColors().text);
  check('a panel swatch leaves the other slot alone',
    picker.getColors().background === '#CCFBF1', picker.getColors().background);
  check('a panel swatch does not switch the active slot', picker.activeSlot === 'text', picker.activeSlot);
  check("the emphasis stays with the active slot's group",
    highSection.classList.contains('is-emphasis') && !lowSection.classList.contains('is-emphasis'));
  picker.setActiveSlot('background');
  check('switching slots keeps both groups mounted',
    !!q(picker, '.preset-section[data-group="text"]') && !!q(picker, '.preset-section[data-group="panel"]'));
  check('switching slots moves the emphasis to the other group',
    lowSection.classList.contains('is-emphasis') && !highSection.classList.contains('is-emphasis'));
  const paleMarked = lowSection.querySelectorAll('.cp-swatch.is-selected');
  check("switching slots marks that slot's own colour, not the last one edited",
    paleMarked.length === 1 && paleMarked[0].dataset.hex === '#CCFBF1',
    `${paleMarked.length}:${paleMarked[0] && paleMarked[0].dataset.hex}`);
  picker.setActiveSlot('text');
  check('returning to the slot shows its colour again', q(picker, '.hex-input').value === tappedHex, q(picker, '.hex-input').value);
  check('the checkmark follows the colour, not the group',
    highSection.querySelectorAll('.cp-swatch.is-selected').length === 0 &&
    lowSection.querySelectorAll('.cp-swatch.is-selected').length === 1);

  // 20. reset restores the checkmarks
  picker.root.querySelector('.reset-btn').click();
  check('reset restores the active slot checkmark',
    highSection.querySelector('.cp-swatch.is-selected').dataset.hex === '#0F766E' &&
    lowSection.querySelectorAll('.cp-swatch.is-selected').length === 0);
  picker.setActiveSlot('background');
  check('the panel group marks the reset panel colour',
    lowSection.querySelector('.cp-swatch.is-selected').dataset.hex === '#CCFBF1');
  picker.setActiveSlot('text');
  picker.close();

  // 21. two instances are independent
  const second = mk({ initialColors: { text: '#991B1B', background: '#FEE2E2' } });
  second.setColors({ text: '#1D4ED8' });
  check('second instance isolated', picker.getColors().text === '#0F766E' && second.getColors().text === '#1D4ED8', `${picker.getColors().text} | ${second.getColors().text}`);
  check('two roots mounted', document.querySelectorAll('.cp-root').length === 2);

  // 16. keyboard on tablist
  picker.open();
  picker.setActiveSlot('text');
  picker.root.querySelectorAll('.tab')[0].dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
  check('arrow key moves tabs', picker.activeSlot === 'background', picker.activeSlot);
  picker.close();

  // 22. contrast suggestions are opt-in
  check('suggestions band is hidden when the option is off', picker.refs.suggestions.hidden);

  const suggPicker = mk({
    initialColors: { text: '#0F766E', background: '#CCFBF1' },
    showContrastSuggestions: true,
    contrastPair: ['text', 'background'],
  });
  suggPicker.open();
  const band = suggPicker.root.querySelector('.suggestions');
  const details = band.querySelector('.cp-suggestions');
  const badge = details.querySelector('.cp-badge');
  const largeBadge = details.querySelector('.cp-badge-large');
  const ratioOut = details.querySelector('.cp-sugg-ratio');
  const shownPartners = () => [...details.querySelectorAll('.cp-partner')].filter((b) => !b.hidden);
  const ratioOfNode = (b) => parseFloat(b.querySelector('.cp-partner-ratio').textContent);

  check('suggestions band shows when enabled', !band.hidden);
  check('suggestions start collapsed', details.open === false);
  check('summary carries the pair ratio', ratioOut.textContent === '4.9:1', ratioOut.textContent);
  check('summary carries the AA verdict', badge.textContent === 'AA' && badge.dataset.level === 'AA', badge.textContent);
  check('AA-large badge stays hidden when AA passes', largeBadge.hidden);
  check('partners are capped at three', shownPartners().length > 0 && shownPartners().length <= 3, String(shownPartners().length));
  check('every partner clears 4.5:1', shownPartners().every((b) => ratioOfNode(b) >= 4.5), shownPartners().map(ratioOfNode).join(' | '));
  check('partners are ranked best first',
    shownPartners().every((b, i, all) => i === 0 || ratioOfNode(all[i - 1]) >= ratioOfNode(b)));

  const pickedPartner = shownPartners()[0].dataset.hex;
  const highBeforeSuggestion = suggPicker.getColors().text;
  shownPartners()[0].click();
  check('a partner applies to the other mode', suggPicker.getColors().background === pickedPartner, suggPicker.getColors().background);
  check('a partner never moves the active color', suggPicker.getColors().text === highBeforeSuggestion, suggPicker.getColors().text);

  suggPicker.setColors({ text: '#7A7A7A', background: '#FFFFFF' });
  check('a failing pair shows the fail badge', badge.dataset.level === 'fail', badge.dataset.level);
  check('the 3:1-4.5:1 band adds the AA-large badge', !largeBadge.hidden);
  check('a failing pair still lists only readable partners', shownPartners().every((b) => ratioOfNode(b) >= 4.5));

  // 23. dark theme repaints through tokens
  const dark = mk({ theme: 'dark', showContrastSuggestions: true, contrastPair: ['text', 'background'] });
  check('dark theme lands on the root', dark.root.dataset.theme === 'dark');
  const lightSurface = getComputedStyle(suggPicker.root.querySelector('.picker')).backgroundColor;
  const darkSurface = getComputedStyle(dark.root.querySelector('.picker')).backgroundColor;
  check('dark theme repaints the surface', darkSurface !== lightSurface, `${darkSurface} vs ${lightSurface}`);
  check('dark theme keeps the ink light',
    getComputedStyle(dark.root).color !== getComputedStyle(suggPicker.root).color,
    `${getComputedStyle(dark.root).color} vs ${getComputedStyle(suggPicker.root).color}`);

  // 24. focus trap and focus restore
  const opener = document.getElementById('host');
  suggPicker.close();
  opener.focus();
  suggPicker.open();
  check('open moves focus into the dialog', suggPicker.root.contains(document.activeElement));
  const focusables = [...suggPicker.root.querySelectorAll('button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])')]
    .filter((node) => node.getClientRects().length > 0);
  const lastFocusable = focusables[focusables.length - 1];
  lastFocusable.focus();
  lastFocusable.dispatchEvent(new KeyboardEvent('keydown', { key: 'Tab', bubbles: true }));
  check('Tab wraps from the last control to the first', document.activeElement === focusables[0], document.activeElement && document.activeElement.className);
  suggPicker.root.querySelector('.primary-btn').click();
  check('closing returns focus to the opener', document.activeElement === opener, document.activeElement && document.activeElement.id);

  // 25. Home / End on the tablist
  suggPicker.open();
  suggPicker.setActiveSlot('background');
  const tabButtons = suggPicker.root.querySelectorAll('.tab');
  tabButtons[0].dispatchEvent(new KeyboardEvent('keydown', { key: 'Home', bubbles: true }));
  check('Home selects the first tab', suggPicker.activeSlot === 'text', suggPicker.activeSlot);
  tabButtons[1].dispatchEvent(new KeyboardEvent('keydown', { key: 'End', bubbles: true }));
  check('End selects the last tab', suggPicker.activeSlot === 'background', suggPicker.activeSlot);
  suggPicker.close();

  // 26. dialog semantics and the SV slider's value
  const a11y = mk({ initialColors: { text: '#0F766E', background: '#CCFBF1' } });
  a11y.open();
  const shell = a11y.root.querySelector('.picker');
  const titleId = shell.getAttribute('aria-labelledby');
  check('shell is a modal dialog',
    shell.getAttribute('role') === 'dialog' && shell.getAttribute('aria-modal') === 'true',
    shell.getAttribute('role'));
  check('dialog is named by its heading',
    !!titleId && !!document.getElementById(titleId)
      && document.getElementById(titleId).textContent === 'Choose Color',
    titleId);
  const svArea = a11y.root.querySelector('.sv');
  const nowBefore = svArea.getAttribute('aria-valuenow');
  svArea.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true }));
  check('sv slider carries its range',
    svArea.getAttribute('aria-valuemin') === '0' && svArea.getAttribute('aria-valuemax') === '100');
  check('sv slider reports the saturation it changes',
    nowBefore !== null && Number(nowBefore) > Number(svArea.getAttribute('aria-valuenow')),
    `${nowBefore} -> ${svArea.getAttribute('aria-valuenow')}`);
  check('sv keeps the hex as its value text',
    /^#[0-9A-F]{6}$/.test(svArea.getAttribute('aria-valuetext')), svArea.getAttribute('aria-valuetext'));
  a11y.close();
  a11y.destroy();

  // 27. escape belongs to the topmost instance only
  const lower = mk({ initialColors: { text: '#0F766E', background: '#CCFBF1' } });
  const upper = mk({ initialColors: { text: '#991B1B', background: '#FEE2E2' } });
  lower.open();
  lower.setColors({ text: '#ABCDEF' });
  upper.open();
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  check('escape closes the topmost picker only', !upper.isOpen && lower.isOpen, `${upper.isOpen} | ${lower.isOpen}`);
  check('escape keeps the lower picker edits', lower.getColors().text === '#ABCDEF', lower.getColors().text);
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  check('the next escape closes the picker below', !lower.isOpen);
  lower.destroy();
  upper.destroy();

  // 28. showAlpha: false turns alpha off instead of hiding it
  const opaque = mk({ showAlpha: false });
  check('showAlpha:false hides the opacity control', opaque.root.querySelector('.alpha-range').hidden);
  opaque.open();
  const opaqueHex = opaque.root.querySelector('.hex-input');
  opaqueHex.value = '#FF000080';
  opaqueHex.dispatchEvent(new Event('change', { bubbles: true }));
  check('showAlpha:false drops the alpha of an 8-digit hex',
    opaque.getColors().text === '#FF0000', opaque.getColors().text);
  // every writer, not just the editor: the option means alpha off on all entry paths
  opaque.setColors({ text: '#00FF0040' });
  check('showAlpha:false clamps alpha on setColors',
    opaque.getColors().text === '#00FF00', opaque.getColors().text);
  check('showAlpha:false leaves the rendered hex opaque too',
    opaqueHex.value === '#00FF00', opaqueHex.value);
  opaque.selectColor('#0000FF33', { source: 'preset' });
  check('showAlpha:false clamps alpha on a preset colour',
    opaque.getColors().text === '#0000FF', opaque.getColors().text);
  let applied = null;
  const opaqueApply = mk({
    showAlpha: false,
    initialColors: { text: '#11223344', background: '#44556677' },
    onApply: (colors) => { applied = colors; },
  });
  check('showAlpha:false clamps alpha in initialColors',
    opaqueApply.getColors().text === '#112233' && opaqueApply.getColors().background === '#445566',
    JSON.stringify(opaqueApply.getColors()));
  opaqueApply.open();
  opaqueApply.apply();
  check('showAlpha:false clamps alpha in the onApply payload',
    applied && applied.text === '#112233', applied && applied.text);
  opaqueApply.reset();
  check('showAlpha:false clamps alpha after reset',
    opaqueApply.getColors().text === '#112233', opaqueApply.getColors().text);
  opaqueApply.destroy();
  opaque.destroy();

  // 29. an editor commit clears the error message the editor left behind
  const stale = mk({ initialColors: { text: '#0F766E', background: '#CCFBF1' } });
  stale.open();
  const staleHex = stale.root.querySelector('.hex-input');
  staleHex.value = '#GGGGGG';
  staleHex.dispatchEvent(new Event('change', { bubbles: true }));
  const staleStatus = stale.root.querySelector('.status');
  check('invalid hex raises a status message', staleStatus.textContent === 'Enter a valid HEX value.', staleStatus.textContent);
  const staleSv = stale.root.querySelector('.sv');
  const staleBox = staleSv.getBoundingClientRect();
  const staleOpts = { bubbles: true, pointerId: 7, clientX: staleBox.left + staleBox.width * 0.3, clientY: staleBox.top + staleBox.height * 0.7 };
  staleSv.dispatchEvent(new PointerEvent('pointerdown', staleOpts));
  staleSv.dispatchEvent(new PointerEvent('pointermove', { ...staleOpts, clientX: staleBox.left + staleBox.width * 0.8, clientY: staleBox.top + staleBox.height * 0.2 }));
  staleSv.dispatchEvent(new PointerEvent('pointerup', { ...staleOpts, pointerId: 7 }));
  check('an editor commit clears the stale error', staleStatus.textContent === '', staleStatus.textContent);
  stale.close();
  stale.destroy();

  // 30. the panel is movable by its header
  const movable = mk({ initialColors: { text: '#0F766E', background: '#CCFBF1' } });
  movable.open();
  const shellPanel = movable.root.querySelector('.picker');
  const shellHeader = movable.root.querySelector('.picker-header');
  const panelStart = shellPanel.getBoundingClientRect();
  const ptr = (type, x, y) => shellHeader.dispatchEvent(new PointerEvent(type, {
    bubbles: true, pointerId: 11, pointerType: 'mouse', button: 0, clientX: x, clientY: y,
  }));
  check('the header is a drag handle', shellHeader.classList.contains('is-draggable'));
  ptr('pointerdown', panelStart.left + 100, panelStart.top + 20);
  ptr('pointermove', panelStart.left - 20, panelStart.top + 60);
  ptr('pointerup', panelStart.left - 20, panelStart.top + 60);
  const panelMoved = shellPanel.getBoundingClientRect();
  // Below 680px the shell is a bottom sheet: the same pointer sequence must not move it.
  const sheetWidth = window.matchMedia('(max-width: 680px)').matches;
  if (sheetWidth) {
    check('a bottom sheet ignores header drags',
      Math.round(panelMoved.left) === Math.round(panelStart.left) && Math.round(panelMoved.top) === Math.round(panelStart.top));
  } else {
    check('dragging the header moves the panel by the pointer delta',
      Math.round(panelMoved.left - panelStart.left) === -120 && Math.round(panelMoved.top - panelStart.top) === 40,
      `${Math.round(panelMoved.left - panelStart.left)}, ${Math.round(panelMoved.top - panelStart.top)}`);
    ptr('pointerdown', panelMoved.left + 100, panelMoved.top + 20);
    ptr('pointermove', -5000, -5000);
    ptr('pointerup', -5000, -5000);
    const panelCorner = shellPanel.getBoundingClientRect();
    check('a drag stops at the viewport edge',
      Math.round(panelCorner.left) === 8 && Math.round(panelCorner.top) === 8,
      `${Math.round(panelCorner.left)}, ${Math.round(panelCorner.top)}`);
    shellHeader.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
    const panelHome = shellPanel.getBoundingClientRect();
    check('double-click re-centres the panel',
      Math.round(panelHome.left) === Math.round(panelStart.left) && Math.round(panelHome.top) === Math.round(panelStart.top),
      `${Math.round(panelHome.left)}, ${Math.round(panelHome.top)}`);
  }
  // The close button must keep working: a press on it never starts a drag.
  movable.root.querySelector('.close-btn').dispatchEvent(new PointerEvent('pointerdown', {
    bubbles: true, pointerId: 12, pointerType: 'mouse', button: 0, clientX: 5, clientY: 5,
  }));
  shellHeader.dispatchEvent(new PointerEvent('pointermove', {
    bubbles: true, pointerId: 12, pointerType: 'mouse', clientX: 400, clientY: 300,
  }));
  check('a press on the close button does not drag the panel',
    Math.round(shellPanel.getBoundingClientRect().left) === Math.round(panelStart.left));
  movable.destroy();

  const fixedShell = mk({ draggable: false });
  fixedShell.open();
  const fixedPanel = fixedShell.root.querySelector('.picker');
  const fixedHeader = fixedShell.root.querySelector('.picker-header');
  const fixedStart = fixedPanel.getBoundingClientRect().left;
  const fixedPt = (type, x, y) => fixedHeader.dispatchEvent(new PointerEvent(type, {
    bubbles: true, pointerId: 13, pointerType: 'mouse', button: 0, clientX: x, clientY: y,
  }));
  fixedPt('pointerdown', fixedStart + 100, 100);
  fixedPt('pointermove', fixedStart + 300, 300);
  fixedPt('pointerup', fixedStart + 300, 300);
  check('draggable:false keeps the shell fixed',
    Math.round(fixedPanel.getBoundingClientRect().left) === Math.round(fixedStart) && !fixedHeader.classList.contains('is-draggable'));
  fixedShell.destroy();

  dark.destroy();
  suggPicker.destroy();

  second.destroy();
  check('destroy removes the root', document.querySelectorAll('.cp-root').length === 1);

  // 31. swatch triggers and popover mode
  const swatchHost = document.createElement('div');
  document.body.append(swatchHost);
  const popEvents = [];
  const pop = mk({
    swatches: swatchHost,
    initialColors: { text: '#0F766E', background: '#CCFBF1' },
    onCancel: () => popEvents.push('cancel'),
    onApply: () => popEvents.push('apply'),
  });
  const triggers = [...swatchHost.querySelectorAll('.cp-trigger')];
  check('one swatch trigger per tab', triggers.length === 2, String(triggers.length));
  check('a swatch is a popup button', triggers.every((b) => b.getAttribute('aria-haspopup') === 'dialog'));
  check('the swatch chip carries its colour',
    triggers[0].querySelector('.cp-trigger-chip').style.getPropertyValue('--cps-fill') === '#0F766E',
    triggers[0].querySelector('.cp-trigger-chip').style.getPropertyValue('--cps-fill'));
  check('the swatch is named with its colour',
    (triggers[1].getAttribute('aria-label') || '').includes('#CCFBF1'), triggers[1].getAttribute('aria-label'));
  check('swatches pick the popover by default', pop.mode === 'popover', pop.mode);
  check('a popover is never draggable', !pop.options.draggable && !pop.refs.header.classList.contains('is-draggable'));
  check('a closed popover paints nothing', getComputedStyle(pop.root).display === 'none', getComputedStyle(pop.root).display);
  check('a popover has no scrim', getComputedStyle(pop.root).backgroundColor === 'rgba(0, 0, 0, 0)', getComputedStyle(pop.root).backgroundColor);

  triggers[1].click();
  const popBox = pop.refs.panel.getBoundingClientRect();
  const anchorBox = triggers[1].getBoundingClientRect();
  check('clicking a swatch opens the picker', pop.isOpen);
  check('the clicked swatch picks its tab', pop.activeSlot === 'background', pop.activeSlot);
  check('only the open swatch is marked expanded',
    triggers[1].getAttribute('aria-expanded') === 'true' && triggers[0].getAttribute('aria-expanded') === 'false');
  check('the panel follows its swatch',
    Math.abs(popBox.top - anchorBox.bottom) <= 12 || Math.abs(anchorBox.top - popBox.bottom) <= 12,
    `${Math.round(popBox.top)} vs ${Math.round(anchorBox.bottom)}`);
  check('the panel stays inside the viewport',
    popBox.left >= 0 && popBox.top >= 0 && popBox.right <= innerWidth + 0.5 && popBox.bottom <= innerHeight + 0.5,
    `${Math.round(popBox.left)},${Math.round(popBox.top)},${Math.round(popBox.right)},${Math.round(popBox.bottom)}`);
  check('a popover renders no footer', getComputedStyle(pop.root.querySelector('.footer')).display === 'none');

  pop.selectColor('#123456', { source: 'preset', slot: 'background' });
  document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
  check('a click outside closes the popover', !pop.isOpen);
  check('the closed popover keeps the edit it was closed with', pop.getColors().background === '#123456', pop.getColors().background);
  check('a popover never cancels or applies', popEvents.length === 0, popEvents.join(','));

  triggers[0].click();
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  check('escape closes the popover', !pop.isOpen);
  check('escape keeps the popover edit too', pop.getColors().background === '#123456');

  triggers[0].click();
  triggers[0].click();
  check('a second click on the same swatch closes it', !pop.isOpen);

  pop.destroy();
  check('destroy removes the swatch bar', swatchHost.querySelector('.cp-trigger') === null);
  swatchHost.remove();

  // 32. header icons, the modal footer, and the HEX error on the field
  const shellPicker = mk({ initialColors: { text: '#0F766E', background: '#CCFBF1' } });
  const resetBtn = shellPicker.root.querySelector('.reset-btn');
  check('reset sits in the header', !!shellPicker.root.querySelector('.picker-header .reset-btn'));
  check('reset is an icon button, named for screen readers',
    resetBtn.textContent.trim() === '↺' && resetBtn.getAttribute('aria-label') === 'Reset',
    `${resetBtn.textContent.trim()} / ${resetBtn.getAttribute('aria-label')}`);
  check('the status line takes no space',
    getComputedStyle(shellPicker.root.querySelector('.status')).position === 'absolute',
    getComputedStyle(shellPicker.root.querySelector('.status')).position);
  shellPicker.open();
  check('a modal keeps its footer', !shellPicker.root.querySelector('.footer').hidden
    && getComputedStyle(shellPicker.root.querySelector('.footer')).display !== 'none');
  const badHex = shellPicker.root.querySelector('.hex-input');
  badHex.value = '#NOPE';
  badHex.dispatchEvent(new Event('change', { bubbles: true }));
  check('a rejected HEX marks the field itself', badHex.getAttribute('aria-invalid') === 'true');
  badHex.value = '#123456';
  badHex.dispatchEvent(new Event('change', { bubbles: true }));
  check('a valid HEX clears the mark', !badHex.hasAttribute('aria-invalid'), badHex.value);
  shellPicker.destroy();

  // 33. arbitrary slots: the id is the answer to "which thing do I paint?"
  const host3 = document.createElement('div');
  document.body.append(host3);
  const three = mk({
    slots: [
      { id: 'text', label: 'Body ink', symbol: 'Aa', presetSet: 'text' },
      { id: 'background', label: 'Card', symbol: '▰', presetSet: 'panel' },
      { id: 'accent', label: 'Accent', symbol: '✦', hint: 'Buttons and links' },
    ],
    initialColors: { text: '#0F766E', background: '#CCFBF1', accent: '#7C3AED' },
    swatches: host3,
    showContrastSuggestions: true,
    contrastPair: ['text', 'background'],
  });
  check('one tab per slot', three.root.querySelectorAll('.tab').length === 3, String(three.root.querySelectorAll('.tab').length));
  check('slot labels reach the tabs',
    [...three.root.querySelectorAll('.tab strong')].map((n) => n.textContent).join('|') === 'Body ink|Card|Accent',
    [...three.root.querySelectorAll('.tab strong')].map((n) => n.textContent).join('|'));
  check('one preset section per palette group', three.root.querySelectorAll('.preset-section').length === 2);
  check('one swatch trigger per slot', host3.querySelectorAll('.cp-trigger').length === 3);
  check('the tab grid is told how many slots there are', three.root.style.getPropertyValue('--cp-slots') === '3',
    three.root.style.getPropertyValue('--cp-slots'));
  // palettes belong to the two groups, whatever the slot count
  check('the palettes stay the two groups',
    Object.keys(three.palettes).join(',') === 'text,panel' && 'Warm' in three.palettes.panel && !('Hot' in three.palettes.panel),
    Object.keys(three.palettes).join(','));
  check('colors are keyed by slot id',
    JSON.stringify(three.getColors()) === JSON.stringify({ text: '#0F766E', background: '#CCFBF1', accent: '#7C3AED' }),
    JSON.stringify(three.getColors()));

  three.open();
  three.setActiveSlot('accent');
  const hex3 = three.root.querySelector('.hex-input');
  hex3.value = '#00AAFF';
  hex3.dispatchEvent(new Event('change', { bubbles: true }));
  check('an editor commit writes only the active slot',
    three.getColors().accent === '#00AAFF' && three.getColors().text === '#0F766E' && three.getColors().background === '#CCFBF1',
    JSON.stringify(three.getColors()));

  const panelSection = three.root.querySelector('.preset-section[data-group="panel"]');
  const accentSwatch = [...panelSection.querySelectorAll('.cp-swatch')]
    .find((n) => n.dataset.hex !== three.getColors().accent);
  const accentHex = accentSwatch.dataset.hex;
  accentSwatch.click();
  check('a third slot can take a pale panel colour', three.getColors().accent === accentHex, three.getColors().accent);
  check('a preset click leaves the other slots alone',
    three.getColors().text === '#0F766E' && three.getColors().background === '#CCFBF1');
  check('a third slot can be emphasised in either group',
    panelSection.classList.contains('is-emphasis') === (three.slots.find((s) => s.id === 'accent').presetSet === 'panel'));
  check('a slot outside contrastPair hides the suggestions',
    three.refs.suggestions.hidden, String(three.refs.suggestions.hidden));
  three.setActiveSlot('text');
  check('a slot inside contrastPair shows them again', !three.refs.suggestions.hidden);
  three.destroy();
  host3.remove();

  // 34. suggestions need a declared pair, not a guess at "the first two"
  const unpaired = mk({ showContrastSuggestions: true });
  unpaired.open();
  check('suggestions hide without contrastPair', unpaired.refs.suggestions.hidden);
  unpaired.destroy();

  // 35. the copy button writes the active slot's HEX and confirms on itself
  const copied = [];
  Object.defineProperty(navigator, 'clipboard', {
    configurable: true,
    value: { writeText: (text) => { copied.push(text); return Promise.resolve(); } },
  });
  const copyPicker = mk({
    initialColors: { text: '#0F766E', background: '#CCFBF1' },
  });
  copyPicker.open();
  const copyBtn = copyPicker.root.querySelector('.hex-row .copy-btn');
  check('the hex field carries a copy button', !!copyBtn, copyBtn ? 'found' : 'missing');
  check('the copy button is named for screen readers',
    copyBtn.getAttribute('aria-label') === 'Copy HEX' && copyBtn.getAttribute('title') === 'Copy HEX',
    copyBtn.getAttribute('aria-label'));
  check('the copy button sits after the hex input',
    copyPicker.root.querySelector('.hex-input').nextElementSibling === copyBtn);
  copyBtn.click();
  await new Promise((resolve) => setTimeout(resolve, 0));
  check('copy writes the active slot value', copied[0] === '#0F766E', copied[0]);
  check('copy confirms on the button',
    copyBtn.dataset.copied === 'true' && copyBtn.getAttribute('aria-label') === 'Copied #0F766E',
    copyBtn.getAttribute('aria-label'));
  check('copy announces on the status region',
    copyPicker.refs.status.textContent === 'Copied #0F766E.', copyPicker.refs.status.textContent);
  copyPicker.setActiveSlot('background');
  copyBtn.click();
  await new Promise((resolve) => setTimeout(resolve, 0));
  check('copy follows the active slot', copied[1] === '#CCFBF1', copied[1]);
  copyPicker.destroy();

  // 36. the shipped default is one colour: no tablist, nothing to pair
  const solo = new ColorPicker({});
  check('the default slot is a single colour',
    JSON.stringify(solo.getColors()) === JSON.stringify({ color: '#0F766E' }), JSON.stringify(solo.getColors()));
  check('a single slot renders no tablist', solo.root.querySelector('.tabs') === null);
  check('a single slot still offers both palettes',
    solo.root.querySelectorAll('.preset-section').length === 2,
    String(solo.root.querySelectorAll('.preset-section').length));
  check('both palettes survive the slot count',
    Object.keys(solo.palettes).join(',') === 'text,panel', Object.keys(solo.palettes).join(','));
  solo.open();
  check('opening a single-slot picker focuses the colour area',
    solo.isOpen && document.activeElement === solo.refs.sv, document.activeElement && document.activeElement.className);
  const pairSized = mk({});
  pairSized.open();
  check('a single-slot panel is shorter than the pair panel',
    solo.refs.panel.getBoundingClientRect().height < pairSized.refs.panel.getBoundingClientRect().height,
    `${Math.round(solo.refs.panel.getBoundingClientRect().height)} < ${Math.round(pairSized.refs.panel.getBoundingClientRect().height)}`);
  const soloHex = solo.root.querySelector('.hex-input');
  soloHex.value = '#2563EB';
  soloHex.dispatchEvent(new Event('change', { bubbles: true }));
  check('the single slot is editable', solo.getColors().color === '#2563EB', solo.getColors().color);
  pairSized.destroy();
  solo.destroy();

  document.title = failures ? `FAIL ${failures}` : 'PASS';
  document.getElementById('results').textContent = out.join('\n');
</script>
</body>
</html>
